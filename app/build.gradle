// =============================================================================
//  app/build.gradle — App Module Build Script
//  Version: 0.1.0  |  Added: Day 1
// =============================================================================
//
//  CONNECTIONS:
//  → build.gradle (root, Day 1)          declares plugin versions
//  → local.properties (Day 1)            provides API keys
//  → backend/config/Constants.kt (Day 2) reads BuildConfig.NEWS_API_KEY
//  → backend/network/ (Day 4)            uses Retrofit dependency
//  → frontend/ (Days 8-13)               uses Compose dependencies
//  → backend/network/GeminiClient (Day 11) uses generativeai dependency
//  → backend/database/ (Day 14)          uses Room + kapt
//
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' 
    id 'com.google.devtools.ksp'
}
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' 
    id 'com.google.devtools.ksp'
}
android {
    namespace 'com.karthik.newsflow'
    compileSdk 34

    defaultConfig {
        applicationId "com.karthik.newsflow"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Secure API key injection from local.properties
        def localProps = new Properties()
        def localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) {
            localPropsFile.withReader('UTF-8') { reader -> localProps.load(reader) }
        }
        buildConfigField "String", "NEWS_API_KEY",
                "\"${localProps.getProperty('NEWS_API_KEY', '')}\""
        buildConfigField "String", "GEMINI_API_KEY",
                "\"${localProps.getProperty('GEMINI_API_KEY', '')}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions { jvmTarget = '1.8' }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions { kotlinCompilerExtensionVersion '1.5.8' }

    packagingOptions {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }
}

dependencies {
    // Android Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Jetpack Compose BOM — manages all compose-* versions together
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Navigation Compose — used Day 10 (NavGraph.kt)
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // ViewModel Compose — used Day 9 (HomeScreen.kt)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Retrofit + OkHttp — used Day 4 (RetrofitInstance.kt, NewsApiService.kt)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines — used Day 5+ (Repository, ViewModel)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Coil — used Day 8 (NewsCard.kt image thumbnails)
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Accompanist WebView — used Day 10 (ArticleDetailScreen.kt)
    implementation 'com.google.accompanist:accompanist-webview:0.32.0'

    // Google Generative AI (Gemini) — used Day 11 (GeminiClient.kt)
    implementation 'com.google.ai.client.generativeai:generativeai:0.2.2'

    // Room Database — used Day 14 (ArticleDao.kt, NewsDatabase.kt)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
